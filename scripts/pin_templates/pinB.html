<!--
  パターン②: Before/After（保存率最強・最優先）
  使い方:
    1) このファイルをコピーして編集（例: cp pinB.html mypin.html）
    2) before.jpg(白紙線画) / after.jpg(完成写真) を同じフォルダに置く
    3) ★ の箇所を差し替え
    4) node scripts/pin_templates/shoot.mjs mypin.html mypin.png
    5) sips -Z 1500 -s format jpeg -s formatOptions 88 mypin.png --out ../pin_assets/mypin.jpg
-->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1500px;font-family:'Hiragino Maru Gothic ProN','YuGothic',sans-serif}
.pin{width:1000px;height:1500px;background:#4FA7B8;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{height:120px;display:flex;align-items:center;justify-content:center}
.kicker{font-weight:900;font-size:40px;color:#fff;letter-spacing:.02em}
.cols{height:1010px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.cell{height:452px;width:892px;position:relative;border-radius:28px;overflow:hidden;border:7px solid #fff;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.cell img{width:100%;height:100%;object-fit:cover;background:#fff}
.lbl{position:absolute;left:24px;top:24px;font-weight:900;font-size:36px;padding:10px 26px;border-radius:14px;color:#fff;z-index:2}
.arrow{color:#fff;font-size:54px;font-weight:900;line-height:1;padding:8px 0}
.bottom{height:370px;background:#fff;padding:44px 60px;text-align:center;display:flex;flex-direction:column;justify-content:center}
.title{font-weight:900;font-size:58px;line-height:1.28;color:#332C24}
.title b{color:#E66A2C}
.sub{margin-top:16px;font-size:30px;color:#6b5f50;font-weight:700}
.url{margin-top:24px;font-size:30px;font-weight:900;color:#4FA7B8}
.d{display:inline-block;width:13px;height:13px;border-radius:50%;vertical-align:middle;margin-right:6px}
</style></head><body>
<div class="pin">
  <div class="top"><div class="kicker">白紙から、夢中の30分へ ✏️</div></div> <!-- ★キャッチ -->
  <div class="cols">
    <div class="cell"><span class="lbl" style="background:#7AA875">Before</span><img src="before.jpg"></div> <!-- ★白紙線画 -->
    <div class="arrow">▼</div>
    <div class="cell"><span class="lbl" style="background:#E66A2C">After</span><img src="after.jpg"></div> <!-- ★完成写真 -->
  </div>
  <div class="bottom">
    <div class="title">3歳が<b>本気で塗った</b>○○ぬりえ</div> <!-- ★タイトル -->
    <div class="sub">無料・登録なし・A4印刷</div>
    <div class="url"><span class="d" style="background:#E66A2C"></span><span class="d" style="background:#4FA7B8"></span><span class="d" style="background:#E8B838;margin-right:14px"></span>nurie-print.com</div>
  </div>
</div></body></html>
