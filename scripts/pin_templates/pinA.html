<!--
  パターン①: 単体記録ピン（完成写真1枚・安定供給）
  使い方:
    1) コピーして編集  2) photo.jpg(完成写真) を同フォルダに置く  3) ★を差し替え
    4) node scripts/pin_templates/shoot.mjs mypin.html mypin.png
    5) sips -Z 1500 -s format jpeg -s formatOptions 88 mypin.png --out ../pin_assets/mypin.jpg
-->
<!DOCTYPE html><html lang="ja"><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1000px;height:1500px;font-family:'Hiragino Maru Gothic ProN','YuGothic',sans-serif}
.pin{width:1000px;height:1500px;background:#FFF8EC;display:flex;flex-direction:column;position:relative;overflow:hidden}
.top{padding:54px 60px 30px;text-align:center}
.kicker{display:inline-block;background:#4FA7B8;color:#fff;font-weight:900;font-size:30px;padding:12px 32px;border-radius:999px;letter-spacing:.04em}
.photo{flex:1;margin:24px 48px;border-radius:36px;overflow:hidden;border:8px solid #fff;box-shadow:0 18px 50px rgba(0,0,0,.16);position:relative}
.photo img{width:100%;height:100%;object-fit:cover}
.tag{position:absolute;top:28px;left:28px;background:#E8B838;color:#3a2c10;font-weight:900;font-size:34px;padding:12px 28px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.12)}
.bottom{padding:10px 60px 56px;text-align:center}
.title{font-weight:900;font-size:62px;line-height:1.3;color:#332C24}
.title b{color:#E66A2C}
.sub{margin-top:18px;font-size:30px;color:#6b5f50;font-weight:700}
.url{margin-top:30px;font-size:30px;font-weight:900;color:#E66A2C}
.d{display:inline-block;width:14px;height:14px;border-radius:50%;vertical-align:middle;margin-right:6px}
</style></head><body>
<div class="pin">
  <div class="top"><span class="kicker">🚄 3歳・○○</span></div> <!-- ★年齢・テーマ -->
  <div class="photo"><div class="tag">むちゅうで30分</div><img src="photo.jpg"></div> <!-- ★完成写真・タグ -->
  <div class="bottom">
    <div class="title">○○がだいすきな子に、<br><b>無料で印刷</b>できるぬりえ</div> <!-- ★タイトル -->
    <div class="sub">登録なし・A4・年齢別3,200点</div>
    <div class="url"><span class="d" style="background:#E66A2C"></span><span class="d" style="background:#4FA7B8"></span><span class="d" style="background:#E8B838;margin-right:14px"></span>nurie-print.com</div>
  </div>
</div></body></html>
